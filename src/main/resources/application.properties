# Servidor HTTP: só aceita conexões desta máquina
quarkus.http.host=127.0.0.1
quarkus.http.port=8098
quarkus.http.limits.max-body-size=8K
quarkus.http.test-port=0

# OpenAI Decisions API
# A chave vem da variável de ambiente OPENAI_API_KEY (no modo dev, também pode vir do arquivo .env).
# Sem chave, o app sobe normalmente: só a classificação automática fica desligada.
card.api-key=${OPENAI_API_KEY:}
card.model=gpt-6-luna
# Formato ISO-8601: PT10S = 10 segundos
card.timeout=PT10S
card.zone=America/Sao_Paulo